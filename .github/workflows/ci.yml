name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (node:test)
        run: node --test
      - name: Worker bundle check
        run: npx --yes wrangler@4 deploy --dry-run
